<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07050d">
<title>Boo</title>
<style>
  :root {
    --bg: #07050d; --panel: #120d1d; --panel2: #1a1229; --fg: #ece6ff; --muted: #8d84a8; --line: #261c3a;
    --accent: #b47cff; --accent2: #4ff0ff; --gold: #ffd36b; --you: #1b1430; --danger: #ff6b8b;
    --pod1: #1d1033; --pod2: #07050d;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f2fb; --panel: #ffffff; --panel2: #f0eaf9; --fg: #1d1530; --muted: #6c6384; --line: #e1d9f0;
            --accent: #7a3cf0; --accent2: #0a9fbd; --gold: #b07800; --you: #ece4fb; --danger: #c9244b; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }
  main { max-width: 860px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(190px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  h1 { font: 700 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .32em; margin: 0; color: var(--accent);
       text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent); }
  .sub { color: var(--muted); font: 11px/1.3 ui-monospace, monospace; flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #chip { font: 600 10px/1 ui-monospace, monospace; letter-spacing: .18em; text-transform: uppercase; padding: 7px 11px; border-radius: 999px;
          border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  #chip::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 7px; vertical-align: 1px; box-shadow: 0 0 8px currentColor; }

  /* the pod: Boo lives in a dark holographic stage in both themes; with the camera on, the width is shared */
  #stage { position: relative; display: flex; gap: 10px; align-items: stretch; height: min(50vh, 460px); min-height: 260px; padding: 10px;
           border-radius: 22px; border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--line));
           background: radial-gradient(ellipse at 50% 38%, var(--pod1), var(--pod2) 72%);
           box-shadow: 0 0 0 1px rgba(255,255,255,.02) inset, 0 18px 50px -24px color-mix(in srgb, var(--accent) 70%, transparent); overflow: hidden; }
  #stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
                  background: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px); }
  #boo { position: relative; flex: 1 1 0; min-width: 0; height: 100%; }
  #boo canvas { display: block; width: 100%; height: 100%; }
  #fallback { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; }
  #fallback div { width: 42%; aspect-ratio: 1; max-width: 220px; border-radius: 50% 50% 42% 42%; background: radial-gradient(circle at 40% 35%, #d7b6ff, #7b3cf0 60%, #2b0f55);
                  box-shadow: 0 0 60px #9b5cff; animation: hover 3s ease-in-out infinite; }
  @keyframes hover { 50% { transform: translateY(-8px); } }
  #selfview { flex: 1 1 0; min-width: 0; height: 100%; object-fit: cover; transform: scaleX(-1); border-radius: 14px;
              border: 1px solid color-mix(in srgb, var(--accent2) 45%, transparent); box-shadow: 0 0 26px -6px color-mix(in srgb, var(--accent2) 60%, transparent);
              background: #000; display: none; }
  #selfview.on { display: block; }
  #hud { position: absolute; left: 6px; top: 4px; z-index: 2; display: flex; gap: 6px; flex-wrap: wrap; max-width: 90%; pointer-events: none; }
  .tag { font: 600 10px/1 ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; padding: 6px 9px; border-radius: 999px;
         color: #e9dcff; background: rgba(24, 12, 44, .72); border: 1px solid rgba(180, 124, 255, .45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: pop .25s ease-out; }
  .tag.deep { color: #ffe7a6; border-color: rgba(255, 211, 107, .6); }
  .tag.look { color: #c9fbff; border-color: rgba(79, 240, 255, .55); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }

  /* each picker takes a full row on a phone and shares rows on a wider screen, never squeezed below its contents */
  #pickers { display: none; gap: 10px; margin: 10px 0 0; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
  #pickers.on { display: grid; }
  #pickers .pick { display: none; align-items: center; gap: 10px; min-width: 0; padding: 6px 6px 6px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
                   font: 600 10px/1 ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  #pickers .pick.on { display: flex; }
  #pickers .pick > span { white-space: nowrap; }
  /* the voice row is full width (names carry a description; on a phone the toggle drops under it); name and agent,
     scan and memory pair up */
  #voicePick { grid-column: 1 / -1; flex-wrap: wrap; row-gap: 8px; }  #voicePick select { flex: 1 1 13em; }
  #pickers .fx { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; padding: 0 6px 0 4px; white-space: nowrap; cursor: pointer; }
  #fxSel { width: 20px; height: 20px; accent-color: #2f7dff; margin: 0; cursor: pointer; }
  #nameIn { flex: 1 1 auto; min-width: 6em; font: 16px/1.2 system-ui, -apple-system, sans-serif; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }
  select { flex: 1 1 auto; min-width: 6.5em; font: 16px/1.2 system-ui, -apple-system, sans-serif; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }

  #tasks { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .task { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--panel);
          border: 1px solid color-mix(in srgb, var(--gold) 40%, var(--line)); animation: pop .25s ease-out; }
  .task .who { font: 700 11px/1 ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
  .task .what { grid-column: 1 / -1; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task .when { font: 11px/1 ui-monospace, monospace; color: var(--muted); }
  .task .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--gold) 30%, transparent); border-top-color: var(--gold); animation: spin .8s linear infinite; }
  .task.done { border-color: color-mix(in srgb, var(--accent2) 40%, var(--line)); }
  .task.done .spin { animation: none; border-color: var(--accent2); background: var(--accent2); }
  .task.error { border-color: color-mix(in srgb, var(--danger) 50%, var(--line)); }
  .task .ask { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .task .ask span { flex: 1 1 100%; color: var(--fg); font-size: 14px; }
  .task .ask button { padding: 7px 14px; font-size: 13px; }
  .task .ask button.yes { border-color: var(--accent2); color: var(--accent2); }
  .task .ask button.no { border-color: var(--danger); color: var(--danger); }
  .task.error .spin { animation: none; border-color: var(--danger); background: var(--danger); }
  @keyframes spin { to { transform: rotate(360deg); } }

  #log { max-height: 22vh; overflow-y: auto; padding: 2px 2px 0; margin-top: 10px; scrollbar-width: thin; }
  #log p { margin: 8px 0; padding: 9px 13px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); overflow-wrap: anywhere; }
  #log .you { background: var(--you); margin-left: 14%; border-bottom-right-radius: 5px; }
  #log .agent { margin-right: 14%; border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); border-bottom-left-radius: 5px; }
  #log .report { border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); }
  #log .report b { display: block; font: 700 10px/1.4 ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
  #log .meta { border: 0; background: none; padding: 0 12px; color: var(--muted); font: 12px/1.4 ui-monospace, monospace; }
  details#metrics { color: var(--muted); font: 11px/1.6 ui-monospace, monospace; margin-top: 6px; }
  details#metrics summary { cursor: pointer; }
  details#metrics div { white-space: pre-wrap; word-break: break-word; }
  #dev { display: none; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
  #dev.on { display: flex; }
  #dev button { padding: 5px 10px; font-size: 12px; }

  footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: color-mix(in srgb, var(--bg) 86%, transparent);
           -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
  footer .row { max-width: 860px; margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); display: flex; gap: 8px; align-items: center; }
  footer .row:last-child { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  button { font: inherit; font-size: 14px; padding: 10px 15px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  button svg { width: 18px; height: 18px; flex: none; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 22px -4px var(--accent); }
  #mic { flex: 1 1 auto; justify-content: center; font-weight: 600; padding: 12px 18px; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, var(--panel)), var(--panel)); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  #mic.on { background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--accent2))); }
  input { flex: 1 1 200px; min-width: 0; font: inherit; font-size: 16px; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
  #state { color: var(--muted); font: 11px/1 ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38%; }
  @media (max-width: 520px) { .lbl { display: none; } #mic .lbl { display: inline; } #state { display: none; } #stage { height: min(46vh, 420px); } }
</style>
</head>
<body>
<main>
  <header>
    <h1>BOO</h1>
    <span class="sub" id="sub">Parakeet · Nemotron 3.5 Bolt · Drama 3 on TensorFold</span>
    <span id="chip">offline</span>
  </header>
  <div id="stage">
    <div id="boo"><div id="fallback"><div></div></div><div id="hud"></div></div>
    <video id="selfview" playsinline muted></video>
  </div>
  <div id="pickers">
    <div class="pick on" id="namePick" title="What the assistant is called; it answers to this name"><span>Name</span><input id="nameIn" maxlength="24" value="Boo" autocomplete="off" spellcheck="false" aria-label="Assistant name"></div>
    <div class="pick" id="agentPick"><span>Agent</span><select id="agentSel" aria-label="Back agent"></select></div>
    <div class="pick" id="enginePick" title="Full: Drama 3, expressive, its own voices. Lite: Kokoro-82M, small and fast, English only"><span>Voice engine</span><select id="engineSel" aria-label="Voice engine"></select></div>
    <div class="pick" id="voicePick"><span>Voice</span><select id="voiceSel" aria-label="Voice"></select>
      <label class="fx" for="fxSel">Futuristic <input type="checkbox" id="fxSel" aria-label="Futuristic voice effect"></label></div>
    <div class="pick on" id="scanPick" title="How often Boo writes down what the camera sees, while the camera is on"><span>Camera scan</span><select id="scanSel" aria-label="How often Boo scans the camera">
      <option value="1">every 1 s</option><option value="2">every 2 s</option><option value="3" selected>every 3 s</option><option value="5">every 5 s</option>
      <option value="10">every 10 s</option><option value="30">every 30 s</option><option value="60">every 1 min</option>
      <option value="300">every 5 min</option><option value="900">every 15 min</option></select></div>
    <div class="pick on" id="keepPick" title="How long Boo remembers what the camera saw"><span>Memory</span><select id="keepSel" aria-label="How long Boo keeps camera memory">
      <option value="1">1 day</option><option value="2" selected>2 days</option><option value="3">3 days</option>
      <option value="5">5 days</option><option value="7">1 week</option></select></div>
  </div>
  <div id="tasks"></div>
  <div id="dev"></div>
  <div id="log"></div>
  <details id="metrics"><summary id="msum">latency</summary><div id="mlines"></div></details>
</main>
<footer>
  <div class="row">
    <button id="mic" aria-label="Start talking"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span class="lbl" id="micLbl">Start talking</span></button>
    <button id="cam" aria-label="Camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7h12v10H3zM15 10l6-3v10l-6-3"/></svg><span class="lbl">Camera</span></button>
    <button id="reset" aria-label="Reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg><span class="lbl">Reset</span></button>
  </div>
  <div class="row">
    <input id="say" placeholder="…or type and press Enter" enterkeyhint="send" autocomplete="off">
    <span id="state">off</span>
  </div>
</footer>
<script type="module">
const $ = (id) => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const mix = (a, b, t) => a + (b - a) * t;
const store = { get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
let ws, ctx, outNode, micNode, micAnalyser, stream, playing = [], playAt = 0, outRate = 44100, agentLine = null;

// ---------- Boo's moods: each is a set of targets the body eases toward ----------
const EMO = {
  neutral:   { hue: 268, eyeH: 1.00, happyL: 0, happyR: 0, round: 0, droop: 0.00, curve: 0.35, mouthW: 1.00, mopen: 0.00, asym: 0.00, tilt: 0.00, spark: 1.0, bounce: 0 },
  happy:     { hue: 276, eyeH: 1.00, happyL: 1, happyR: 1, round: 0, droop: 0.00, curve: 0.95, mouthW: 1.15, mopen: 0.05, asym: 0.00, tilt: 0.05, spark: 1.4, bounce: 0.4 },
  excited:   { hue: 282, eyeH: 1.15, happyL: 0.7, happyR: 0.7, round: 0, droop: 0.00, curve: 1.00, mouthW: 1.25, mopen: 0.22, asym: 0.00, tilt: 0.00, spark: 2.2, bounce: 1 },
  curious:   { hue: 262, eyeH: 1.08, happyL: 0, happyR: 0, round: 0.2, droop: 0.00, curve: 0.15, mouthW: 0.80, mopen: 0.00, asym: 0.28, tilt: 0.16, spark: 1.2, bounce: 0 },
  thinking:  { hue: 258, eyeH: 0.80, happyL: 0, happyR: 0, round: 0, droop: 0.00, curve: -0.05, mouthW: 0.70, mopen: 0.00, asym: 0.12, tilt: -0.08, spark: 1.6, bounce: 0 },
  surprised: { hue: 272, eyeH: 1.25, happyL: 0, happyR: 0, round: 1, droop: 0.00, curve: 0.00, mouthW: 0.75, mopen: 0.45, asym: 0.00, tilt: 0.00, spark: 1.8, bounce: 0.3 },
  concerned: { hue: 262, eyeH: 0.92, happyL: 0, happyR: 0, round: 0, droop: 0.45, curve: -0.45, mouthW: 0.85, mopen: 0.00, asym: 0.00, tilt: 0.08, spark: 0.8, bounce: 0 },
  sad:       { hue: 256, eyeH: 0.78, happyL: 0, happyR: 0, round: 0, droop: 0.85, curve: -0.85, mouthW: 0.80, mopen: 0.00, asym: 0.00, tilt: 0.12, spark: 0.5, bounce: 0 },
  playful:   { hue: 284, eyeH: 1.00, happyL: 0, happyR: 1, round: 0, droop: 0.00, curve: 0.85, mouthW: 1.10, mopen: 0.06, asym: 0.00, tilt: -0.14, spark: 1.6, bounce: 0.5 },
};
let emotion = "neutral", target = EMO.neutral, mood = { ...EMO.neutral }, emoTimer = null;
function setEmotion(e, holdMs) {
  if (!EMO[e]) return;
  clearTimeout(emoTimer); emotion = e; target = EMO[e];
  if (holdMs) emoTimer = setTimeout(() => setEmotion("neutral"), holdMs);
}

let state = "idle", stateAt = 0, endPending = false;
const LABEL = { idle: "standby", listening: "listening", thinking: "thinking", speaking: "speaking", interrupted: "interrupted" };
function setState(s) { state = s; stateAt = performance.now(); $("chip").textContent = LABEL[s] || s; if (s === "interrupted") blinkAt = performance.now(); }

let gaze = { x: 0, y: 0 }, gazeTarget = { x: 0, y: 0 }, nextWander = 0, blinkAt = performance.now() + 2500, micLevel = 0, speakLevel = 0;
let tracker = null, trackerLoading = null, lastDetect = 0, lastFaceAt = -1e9, facePresent = false, faceGaze = null;
const activeTasks = new Map();
let orbUntil = 0;

// ---------- audio out: every chunk goes through an analyser that drives the mouth ----------
// "Futuristic": Boo's voice through a light chorus, a short airy echo and a treble lift, all in the browser (no cost
// on the server; off, the voice plays untouched)
let fxIn = null, fxOn = store.get("boo.fx") === "1";
function buildFx() {
  const input = ctx.createGain(), mix = ctx.createGain();
  input.connect(mix);  // dry
  for (const [ms, rate] of [[22, 0.25], [37, 0.33]]) {  // chorus: two slowly wobbling delays
    const d = ctx.createDelay(0.1), g = ctx.createGain(), lfo = ctx.createOscillator(), depth = ctx.createGain();
    d.delayTime.value = ms / 1000; g.gain.value = 0.32; lfo.frequency.value = rate; depth.gain.value = 0.0018;
    lfo.connect(depth).connect(d.delayTime); lfo.start(); input.connect(d).connect(g).connect(mix);
  }
  for (const [ms, level] of [[55, 0.14], [110, 0.08]]) {  // short airy echo
    const d = ctx.createDelay(0.2), g = ctx.createGain(); d.delayTime.value = ms / 1000; g.gain.value = level;
    input.connect(d).connect(g).connect(mix);
  }
  const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 110;
  const air = ctx.createBiquadFilter(); air.type = "highshelf"; air.frequency.value = 6500; air.gain.value = 4;
  const lim = ctx.createDynamicsCompressor(); lim.threshold.value = -3; lim.ratio.value = 20; lim.attack.value = 0.003; lim.release.value = 0.1;
  const trim = ctx.createGain(); trim.gain.value = 0.8;
  mix.connect(hp).connect(air).connect(trim).connect(lim).connect(outNode);
  return input;
}
function ensureAudio() {
  if (!ctx) ctx = new AudioContext();
  if (!outNode) { outNode = ctx.createAnalyser(); outNode.fftSize = 1024; outNode.connect(ctx.destination); }
  if (!fxIn) fxIn = buildFx();
  return ctx;
}
function stopAudio() { for (const s of playing) { try { s.stop(); } catch (_) {} } playing = []; playAt = 0; }
function play(buf) {
  ensureAudio();
  const pcm = new Int16Array(buf), f = new Float32Array(pcm.length);
  for (let i = 0; i < pcm.length; i++) f[i] = pcm[i] / 32768;
  const b = ctx.createBuffer(1, f.length, outRate); b.copyToChannel(f, 0);
  const s = ctx.createBufferSource(); s.buffer = b; s.connect(fxOn ? fxIn : outNode);
  playAt = Math.max(playAt, ctx.currentTime + 0.03); s.start(playAt); playAt += b.duration;
  playing.push(s); s.onended = () => { playing = playing.filter((x) => x !== s); };
}
const tbuf = new Float32Array(1024);
function rms(an) { if (!an) return 0; an.getFloatTimeDomainData(tbuf); let s = 0; for (let i = 0; i < tbuf.length; i++) s += tbuf[i] * tbuf[i]; return Math.sqrt(s / tbuf.length); }

// ---------- transcript, status tags, task cards, metrics ----------
function line(cls, text) { const p = document.createElement("p"); p.className = cls; p.textContent = text; $("log").append(p); p.scrollIntoView({ block: "nearest" }); return p; }
function tag(cls, text, ms = 4000) {
  const t = document.createElement("span"); t.className = "tag " + cls; t.textContent = text; $("hud").append(t);
  setTimeout(() => t.remove(), ms);
  while ($("hud").children.length > 3) $("hud").firstChild.remove();
}
function metrics(e) {
  const kv = Object.entries(e).filter(([k]) => k !== "type");
  const d = document.createElement("div"); d.textContent = kv.map(([k, v]) => k + " " + v).join(" · "); $("mlines").prepend(d);
  while ($("mlines").children.length > 20) $("mlines").lastChild.remove();
  $("msum").textContent = "latency" + (e.first_audio_ms != null ? " · first audio " + Math.round(e.first_audio_ms) + " ms" : "");
}
function taskCard(e) {
  let c = [...$("tasks").children].find((x) => x.dataset.id === String(e.id));
  if (!c) {
    c = document.createElement("div"); c.className = "task"; c.dataset.id = e.id; c.dataset.start = Date.now();
    c.innerHTML = '<span class="spin"></span><span class="who"></span><span class="when"></span><span class="what"></span>';
    c.querySelector(".who").textContent = e.agent || "agent"; $("tasks").prepend(c);
    while ($("tasks").children.length > 4) $("tasks").lastChild.remove();
  }
  const what = c.querySelector(".what"), when = c.querySelector(".when");
  if (e.state === "started") { what.textContent = "working…"; activeTasks.set(e.id, Date.now()); }
  if (e.state === "step") what.textContent = (e.kind === "permission" ? "allowed " : "") + (e.text || "working…");
  if (e.state === "done" || e.state === "error") {
    activeTasks.delete(e.id); c.classList.add(e.state);
    what.textContent = e.state === "done" ? (e.text || "done") : "error: " + (e.text || "");
    when.textContent = e.seconds != null ? e.seconds + " s" : "";
    setTimeout(() => c.remove(), 30000);

  for (let i = 0; i < fp.count; i++) { const x = fp.getX(i), y = fp.getY(i) + 0.27; fp.setXYZ(i, x, y, Math.sqrt(Math.max(0.0001, R(y) ** 2 - x * x)) + 0.012); }
  const faceU = { uTime: time, uOpenL: { value: 1 }, uOpenR: { value: 1 }, uHappyL: { value: 0 }, uHappyR: { value: 0 }, uRound: { value: 0 }, uDroop: { value: 0 },
    uMouthOpen: { value: 0 }, uCurve: { value: 0.35 }, uMouthW: { value: 1 }, uEyeH: { value: 1 }, uAsym: { value: 0 }, uFlicker: { value: 1 },
    uLook: { value: new THREE.Vector2() }, uEye: { value: new THREE.Color(0xbff8ff) }, uMouth: { value: new THREE.Color(0xd8ccff) } };
  body.add(new THREE.Mesh(facePlane, new THREE.ShaderMaterial(additive(THREE, { uniforms: faceU, fragmentShader: FACE_FS,
    vertexShader: "varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }" }))));

  // circuit traces on the back and sides, with pulses running along them
  const tp = [], ta = [], nodes = [];
  const surf = (phi, y) => { const r = R(y) * 1.012; return [r * Math.sin(phi), y, r * Math.cos(phi)]; };
  for (let i = 0; i < 22; i++) {
    const side = i % 3 === 0, sign = Math.random() < 0.5 ? -1 : 1;
    let phi = side ? sign * (0.62 + Math.random() * 0.4) : 0.95 + Math.random() * (Math.PI * 2 - 1.9);
    let y = side ? -0.12 + Math.random() * 0.62 : -0.12 + Math.random() * 1.1, along = Math.random();
    const segs = 3 + Math.floor(Math.random() * 4);
    nodes.push(...surf(phi, y));
    for (let s = 0; s < segs; s++) {
      const dPhi = s % 2 === 0 ? (Math.random() < 0.5 ? -1 : 1) * (0.15 + Math.random() * 0.3) : 0;
      const dY = s % 2 === 1 ? (Math.random() < 0.5 ? -1 : 1) * (0.08 + Math.random() * 0.2) : 0;
      const nPhi = side ? sign * clamp(Math.abs(phi + dPhi), 0.58, 1.3) : clamp(phi + dPhi, 0.9, Math.PI * 2 - 0.9), nY = clamp(y + dY, -0.15, side ? 0.55 : 1.08);
      for (let k = 0; k < 5; k++) {
        tp.push(...surf(mix(phi, nPhi, k / 5), mix(y, nY, k / 5)), ...surf(mix(phi, nPhi, (k + 1) / 5), mix(y, nY, (k + 1) / 5)));
        ta.push(along + (k / 5) * 0.12, along + ((k + 1) / 5) * 0.12);
      }
      along += 0.12; phi = nPhi; y = nY;
    }
    nodes.push(...surf(phi, y));
  }
  for (let k = 0; k < 96; k++) {  // the waist seam, a full ring between the mouth and the core
    tp.push(...surf((k / 96) * Math.PI * 2, -0.13), ...surf(((k + 1) / 96) * Math.PI * 2, -0.13)); ta.push(k / 24, (k + 1) / 24);
  }
  const traceGeo = new THREE.BufferGeometry();
  traceGeo.setAttribute("position", new THREE.Float32BufferAttribute(tp, 3)); traceGeo.setAttribute("along", new THREE.Float32BufferAttribute(ta, 1));
  const traceMat = new THREE.ShaderMaterial(additive(THREE, { uniforms: { uTime: time, uColor: { value: new THREE.Color(0x4ff0ff) }, uSpeed: { value: 0.35 } },
    vertexShader: "attribute float along; varying float vA; void main() { vA = along; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
    fragmentShader: "uniform float uTime, uSpeed; uniform vec3 uColor; varying float vA; void main() { float p = smoothstep(0.86, 1.0, fract(vA * 1.4 - uTime * uSpeed)); float b = 0.1 + p * 0.85; gl_FragColor = vec4(uColor * b, b); }" }));
  body.add(new THREE.LineSegments(traceGeo, traceMat));
  const nodeGeo = new THREE.BufferGeometry(); nodeGeo.setAttribute("position", new THREE.Float32BufferAttribute(nodes, 3));
  const nodeMat = new THREE.PointsMaterial(additive(THREE, { size: 0.05, map: glow, color: 0x9ff8ff, opacity: 0.55 }));
  body.add(new THREE.Points(nodeGeo, nodeMat));

  // chest core: an electric-blue hexagonal ring that spins faster with the voice (kept quiet beside the eyes and mouth)
  const core = new THREE.Mesh(new THREE.RingGeometry(0.06, 0.095, 6), new THREE.MeshBasicMaterial(additive(THREE, { color: 0x2f7dff, opacity: 0.85, side: THREE.DoubleSide })));
  core.position.set(0, -0.32, R(-0.32) + 0.015); body.add(core);
  const coreGlow = new THREE.Sprite(new THREE.SpriteMaterial(additive(THREE, { map: glow, color: 0x1f5fff, opacity: 0.3 })));
  coreGlow.scale.setScalar(0.45); coreGlow.position.copy(core.position); body.add(coreGlow);

  // little arms that wave when Boo is happy
  const armGeo = new THREE.SphereGeometry(0.2, 24, 16), arms = [];
  for (const s of [-1, 1]) {
    const pivot = new THREE.Group(); pivot.position.set(s * 0.9, -0.05, 0.05);
    const arm = new THREE.Mesh(armGeo, skin); arm.scale.set(0.85, 1.45, 0.85); arm.position.set(s * 0.12, -0.12, 0); pivot.add(arm);
    pivot.rotation.z = s * 0.55; body.add(pivot); arms.push(pivot);
  }

  // antenna with a blinking tip, and a halo ring above the head
  const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.02, 0.34, 8), new THREE.MeshBasicMaterial({ color: 0x6a4fb8, transparent: true, opacity: 0.7 }));
  antenna.position.set(0.36, 1.3, 0); antenna.rotation.z = -0.55; body.add(antenna);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 12), new THREE.MeshBasicMaterial({ color: 0x9ff8ff }));
  tip.position.set(0.455, 1.445, 0); body.add(tip);
  const tipGlow = new THREE.Sprite(new THREE.SpriteMaterial(additive(THREE, { map: glow, color: 0x6fefff })));
  tipGlow.scale.setScalar(0.4); tipGlow.position.copy(tip.position); body.add(tipGlow);
  const halo = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.013, 8, 96), new THREE.MeshBasicMaterial(additive(THREE, { color: 0xb98cff, opacity: 0.85 })));
  halo.position.y = 1.7; halo.rotation.x = Math.PI / 2 - 0.25; body.add(halo);

  // the thinking ring: an arc of data that spins around Boo while it thinks
  const thinkRing = new THREE.Mesh(new THREE.TorusGeometry(1.45, 0.008, 6, 160, Math.PI * 1.4), new THREE.MeshBasicMaterial(additive(THREE, { color: 0x4ff0ff, opacity: 0 })));
  thinkRing.rotation.x = Math.PI / 2 - 0.35; scene.add(thinkRing);

  // data motes orbiting
  const N = 130, motes = new Float32Array(N * 3), mp = [];
  for (let i = 0; i < N; i++) mp.push({ r: 1.45 + Math.random() * 0.9, y: -1.2 + Math.random() * 2.8, a: Math.random() * Math.PI * 2, s: 0.12 + Math.random() * 0.32, w: Math.random() * 6 });
  const moteGeo = new THREE.BufferGeometry(); moteGeo.setAttribute("position", new THREE.BufferAttribute(motes, 3));
  const moteMat = new THREE.PointsMaterial(additive(THREE, { size: 0.055, map: glow, color: 0xd6b8ff, opacity: 0.85 }));
  scene.add(new THREE.Points(moteGeo, moteMat));

  // the agent orb: summoned while a back agent works
  const orb = new THREE.Group();
  orb.add(new THREE.Mesh(new THREE.SphereGeometry(0.075, 20, 14), new THREE.MeshBasicMaterial({ color: 0xffe08a })));
  const orbGlow = new THREE.Sprite(new THREE.SpriteMaterial(additive(THREE, { map: glow, color: 0xffc94f }))); orbGlow.scale.setScalar(0.6); orb.add(orbGlow);
  orb.scale.setScalar(0.001); scene.add(orb);

  // aura behind Boo and a holographic floor it hovers over
  const aura = new THREE.Sprite(new THREE.SpriteMaterial(additive(THREE, { map: glow, color: 0x4b22a8, opacity: 0.4 })));
  aura.scale.set(5.2, 5.2, 1); aura.position.set(0, 0.2, -1.4); scene.add(aura);
  const floorMat = new THREE.ShaderMaterial(additive(THREE, { uniforms: { uTime: time, uColor: { value: new THREE.Color(0x9b5cff) }, uLift: { value: 0 } },
    vertexShader: "varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
    fragmentShader: `uniform float uTime, uLift; uniform vec3 uColor; varying vec2 vUv; void main() {
      float r = length(vUv - 0.5) * 2.0; float rings = pow(abs(sin((r * 7.0 - uTime * 0.5) * 3.14159)), 30.0);
      float fade = 1.0 - smoothstep(0.2, 1.0, r); float pool = (1.0 - smoothstep(0.0, 0.55 + uLift * 0.1, r)) * (0.55 - uLift * 0.25);
      float b = (rings * 0.45 + pool) * fade; gl_FragColor = vec4(uColor * b, b); }` }));
  const floor = new THREE.Mesh(new THREE.CircleGeometry(2.3, 64), floorMat); floor.rotation.x = -Math.PI / 2; floor.position.y = -1.62; scene.add(floor);

  // frame Boo whatever the stage's shape: the camera backs off until the whole ghost fits
  function fit() {
    const w = host.clientWidth || 1, h = host.clientHeight || 1, aspect = w / h, tan = Math.tan((camera.fov * Math.PI) / 360);
    renderer.setSize(w, h, false); camera.aspect = aspect;
    camera.position.set(0, 0.4, Math.max(4.0 / 2 / tan, 2.7 / 2 / (tan * aspect)));
    camera.lookAt(look); camera.updateProjectionMatrix();
  }
  new ResizeObserver(fit).observe(host); fit();

  const C = new THREE.Color(), hsl = (h, s, l) => C.setHSL((((h % 360) + 360) % 360) / 360, s, l);
  coreSpin = 0.35;
  boo = { renderer, scene, camera, time, body, skin, rimMat, faceU, traceMat, nodeMat, core, coreGlow, arms, tipGlow, halo, thinkRing,
          mp, motes, moteGeo, moteMat, orb, aura, floorMat, hsl };
}

// ---------- the loop: mood easing, levels, gaze, blinks, then Boo ----------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; return; }
  const dt = Math.min(0.1, (now - last) / 1000), t = now / 1000; last = now;
  track(now);
  const k = 1 - Math.exp(-dt * 6);
  for (const key in target) mood[key] += (target[key] - mood[key]) * k;
  const sp = clamp(rms(outNode) * 5.5, 0, 1.2), mic = clamp(rms(micAnalyser) * 6, 0, 1);
  speakLevel += (sp - speakLevel) * (sp > speakLevel ? 0.55 : 0.18);
  micLevel += (mic - micLevel) * (mic > micLevel ? 0.5 : 0.12);
  if (state === "speaking" && endPending && ctx && ctx.currentTime >= playAt) { endPending = false; setState("idle"); $("state").textContent = micNode ? "listening" : "ready"; }
  // gaze: thinking looks up and aside, a tracked face is followed, otherwise Boo glances around
  if (state === "thinking") gazeTarget = { x: -0.6, y: 0.7 };
  else if (faceGaze && now - lastFaceAt < 2500) gazeTarget = { x: faceGaze.x + Math.sin(t * 0.7) * 0.03, y: -faceGaze.y };
  else if (now > nextWander) { const s = state === "idle" ? 0.5 : 0.22; gazeTarget = { x: (Math.random() * 2 - 1) * s, y: (Math.random() * 2 - 1) * s * 0.5 }; nextWander = now + 1200 + Math.random() * 2800; }
  const gk = 1 - Math.exp(-dt * 8); gaze.x += (gazeTarget.x - gaze.x) * gk; gaze.y += (gazeTarget.y - gaze.y) * gk;
  // blinks: every 2-6 s, quick and doubled on interruption
  let blink = 0, bt = now - blinkAt;
  if (bt >= 0 && bt < 150) blink = Math.sin(Math.PI * bt / 150);
  else if (bt >= 150) blinkAt = state === "interrupted" && bt < 400 ? now + 60 : now + 2200 + Math.random() * 4200;
  if (!boo) return;

  const b = boo, u = b.faceU;
  b.time.value = t;
  const wide = state === "listening" ? 1.06 + micLevel * 0.1 : state === "interrupted" ? 1.12 : 1;
  u.uOpenL.value = (1 - blink) * wide; u.uOpenR.value = (1 - blink) * wide;
  u.uHappyL.value = mood.happyL; u.uHappyR.value = mood.happyR; u.uRound.value = mood.round; u.uDroop.value = mood.droop;
  u.uEyeH.value = mood.eyeH; u.uAsym.value = mood.asym; u.uCurve.value = mood.curve; u.uMouthW.value = mood.mouthW;
  u.uMouthOpen.value = clamp(mood.mopen + (state === "speaking" ? speakLevel * 0.9 : 0), 0, 1.1);
  u.uLook.value.set(gaze.x, gaze.y);
  const flick = state === "interrupted" && now - stateAt < 350 ? 0.55 + Math.random() * 0.45 : 1;
  u.uFlicker.value = flick;

  // colour: the mood's hue across body, rim, traces, aura and floor
  const hue = mood.hue;
  const su = b.skin.uniforms;
  su.uTop.value.copy(b.hsl(hue, 0.58, 0.36)); su.uBottom.value.copy(b.hsl(hue - 4, 0.65, 0.16)); su.uRim.value.copy(b.hsl(hue - 8, 0.85, 0.62));
  b.rimMat.uniforms.uColor.value.copy(b.hsl(hue - 10, 0.9, 0.62));
  b.traceMat.uniforms.uColor.value.copy(b.hsl(192, 0.9, 0.6)); b.nodeMat.color.copy(b.hsl(192, 0.9, 0.7));
  b.halo.material.color.copy(b.hsl(hue - 6, 0.7, 0.62)); b.aura.material.color.copy(b.hsl(hue - 4, 0.75, 0.3));
  u.uEye.value.copy(b.hsl(190 + (hue - 275) * 0.4, 1, 0.84));
  b.floorMat.uniforms.uColor.value.copy(b.hsl(hue - 6, 0.75, 0.5));
  b.moteMat.color.copy(b.hsl(hue - 10, 0.6, 0.72));

  // energy: listening follows the microphone, speaking the voice, thinking pulses
  const level = clamp(state === "speaking" ? speakLevel : state === "listening" ? micLevel : state === "thinking" ? 0.35 + 0.2 * Math.sin(t * 5) : 0.08 + 0.05 * Math.sin(t * 1.3), 0, 1);
  b.rimMat.uniforms.uPower.value = (0.85 + level * 1.1) * flick;
  su.uEnergy.value = (0.8 + level * 0.9) * flick;
  b.aura.material.opacity = 0.22 + level * 0.25;
  b.traceMat.uniforms.uSpeed.value = 0.25 + mood.spark * 0.18 + (state === "thinking" ? 0.6 : 0);
  coreSpin += ((state === "speaking" ? 2.2 + speakLevel * 9 : 0.35) - coreSpin) * Math.min(1, dt * 4);  // eased spin speed
  b.coreGlow.scale.setScalar(0.4); b.core.rotation.z -= dt * coreSpin;
  b.tipGlow.material.opacity = Math.sin(t * 4) > 0.6 ? 1 : 0.35;

  // motion: hover, sway, a turn toward the person, a bounce when excited, arms that wave
  const bounce = mood.bounce * Math.abs(Math.sin(t * (state === "speaking" ? 7 : 3.5))) * 0.09;
  b.body.position.y = Math.sin(t * 1.5) * 0.07 + bounce;
  const toward = faceGaze && now - lastFaceAt < 2500 ? faceGaze.x : 0;
  b.body.rotation.y += ((toward * 0.35 + Math.sin(t * 0.6) * 0.12 + gaze.x * 0.08) - b.body.rotation.y) * gk;
  b.body.rotation.x += ((-gaze.y * 0.06) - b.body.rotation.x) * gk;
  b.body.rotation.z = mood.tilt + Math.sin(t * 0.9) * 0.03;
  const wave = mood.bounce > 0.2 ? Math.sin(t * 6) * 0.35 : Math.sin(t * 1.4) * 0.08;
  b.arms[0].rotation.z = -0.55 - wave; b.arms[1].rotation.z = 0.55 + wave * (state === "speaking" ? 0.6 : 0.3);
  b.halo.rotation.z += dt * (0.5 + (state === "thinking" ? 3 : 0));
  b.floorMat.uniforms.uLift.value = b.body.position.y * 6;

  // the thinking ring fades in and spins
  b.thinkRing.material.opacity += ((state === "thinking" ? 0.75 : 0) - b.thinkRing.material.opacity) * k;
  b.thinkRing.rotation.z += dt * 2.6;

  // motes orbit, faster with energy and mood
  const speed = (0.6 + mood.spark * 0.5 + level * 1.4) * (state === "thinking" ? 2.2 : 1);
  for (let i = 0; i < b.mp.length; i++) {
    const m = b.mp[i]; m.a += dt * m.s * speed;
    b.motes[i * 3] = Math.cos(m.a) * m.r; b.motes[i * 3 + 1] = m.y + Math.sin(t * 0.8 + m.w) * 0.1; b.motes[i * 3 + 2] = Math.sin(m.a) * m.r;
  }
  b.moteGeo.attributes.position.needsUpdate = true;

  // the agent orb, while a back agent works
  const orbOn = activeTasks.size > 0 || now < orbUntil ? 1 : 0;
  b.orb.scale.setScalar(Math.max(0.001, b.orb.scale.x + (orbOn - b.orb.scale.x) * (1 - Math.exp(-dt * 4))));
  b.orb.position.set(Math.cos(t * 1.7) * 1.55, 0.55 + Math.sin(t * 2.3) * 0.25, Math.sin(t * 1.7) * 1.55);

  b.renderer.render(b.scene, b.camera);
}
requestAnimationFrame(frame);

// dev row: "?" previews each mood and state
for (const e of Object.keys(EMO)) { const b = document.createElement("button"); b.textContent = e; b.onclick = () => setEmotion(e); $("dev").append(b); }
for (const s of ["idle", "listening", "thinking", "speaking", "interrupted"]) { const b = document.createElement("button"); b.textContent = "▸ " + s; b.onclick = () => setState(s); $("dev").append(b); }
{ const b = document.createElement("button"); b.textContent = "▸ agent orb"; b.onclick = () => { orbUntil = performance.now() + 6000; tag("deep", "→ Hermes", 3000); }; $("dev").append(b); }
document.addEventListener("keydown", (e) => { if (e.key === "?" && document.activeElement !== $("say")) $("dev").classList.toggle("on"); });

fetch("/health").then((r) => r.json()).then((h) => { $("sub").textContent = h.asr.split("/").pop() + " · " + h.brain + " · " + h.voice + (h.voice_lite ? " / " + h.voice_lite : "") + (h.eyes ? " · eyes " + h.eyes : "") + (h.d1 ? " · assist " + h.d1 : "") + " (" + h.profile + ")"; }).catch(() => {});
$("fxSel").checked = fxOn;
$("fxSel").onchange = () => { fxOn = $("fxSel").checked; store.set("boo.fx", fxOn ? "1" : "0"); tag("look", fxOn ? "voice · futuristic on" : "voice · futuristic off", 2000); };
{ const saved = store.get("boo.scan"); if (saved && [...$("scanSel").options].some((o) => o.value === saved)) $("scanSel").value = saved; }
$("scanSel").onchange = () => { store.set("boo.scan", $("scanSel").value); send({ type: "scan", seconds: +$("scanSel").value }); tag("look", "camera scan · " + $("scanSel").selectedOptions[0].textContent, 2000); };
{ const saved = store.get("boo.keep"); if (saved && [...$("keepSel").options].some((o) => o.value === saved)) $("keepSel").value = saved; }
$("keepSel").onchange = () => { store.set("boo.keep", $("keepSel").value); send({ type: "keep", days: +$("keepSel").value }); tag("look", "memory · " + $("keepSel").selectedOptions[0].textContent, 2000); };
// the assistant's name: shown in the header and tab, and sent to the server so it answers to it
function assistantName() { return ($("nameIn").value || "").replace(/[^\p{L}\p{N} '-]/gu, "").trim().slice(0, 24) || "Boo"; }
function showName() { const n = assistantName(); document.title = n; document.querySelector("header h1").textContent = n.toUpperCase(); }
{ const saved = store.get("boo.name"); if (saved) $("nameIn").value = saved; showName(); }
$("nameIn").onchange = () => { const n = assistantName(); $("nameIn").value = n; store.set("boo.name", n); showName(); send({ type: "name", name: n }); tag("look", "name · " + n, 2000); };
$("nameIn").onkeydown = (e) => { if (e.key === "Enter") $("nameIn").blur(); };
connect();
initBoo();
</script>
